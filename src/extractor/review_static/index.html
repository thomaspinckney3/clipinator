<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipinator Review Editor</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; color: #1a1a1a; background: #f4f4f6; }
  header { background: #1a1a2e; color: #fff; padding: 0.8rem 1.2rem; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header .lib { font-size: 0.8rem; opacity: 0.7; margin-top: 0.2rem; }
  .layout { display: flex; height: calc(100vh - 60px); }
  .sidebar { width: 18rem; overflow-y: auto; background: #fff; border-right: 1px solid #ddd; }
  .sidebar .proj { padding: 0.7rem 1rem; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.9rem; }
  .sidebar .proj:hover { background: #eef2ff; }
  .sidebar .proj.active { background: #dde6ff; }
  .sidebar .proj .meta { font-size: 0.75rem; color: #888; }
  .sidebar .proj.missing { color: #b00; }
  main { flex: 1; overflow-y: auto; padding: 1.2rem 1.6rem; }
  .clip { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
  .clip h3 { margin: 0 0 0.4rem; font-size: 1rem; }
  .players { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  video { max-width: 280px; max-height: 360px; background: #000; border-radius: 4px; }
  table { border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
  td, th { border: 1px solid #e3e3e3; padding: 0.25rem 0.55rem; }
  .badge { display: inline-block; font-size: 0.72rem; background: #ffe9c7; color: #8a5a00; padding: 0.1rem 0.45rem; border-radius: 999px; margin-left: 0.4rem; }
  .hint { color: #777; font-size: 0.85rem; }
  .empty { color: #777; padding: 2rem; }
</style>
</head>
<body>
<header>
  <h1>Clipinator Review Editor</h1>
  <div class="lib" id="lib"></div>
</header>
<div class="layout">
  <div class="sidebar" id="sidebar"><div class="empty">Loading projects…</div></div>
  <main id="main"><div class="empty">Select a project on the left.</div></main>
</div>
<script>
const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

async function loadProjects() {
  const res = await fetch('/api/projects');
  const data = await res.json();
  document.getElementById('lib').textContent = 'Library: ' + data.library;
  const sb = document.getElementById('sidebar');
  if (!data.projects.length) {
    sb.innerHTML = '<div class="empty">No projects found in the library folder.</div>';
    return;
  }
  sb.innerHTML = '';
  for (const p of data.projects) {
    const el = document.createElement('div');
    el.className = 'proj' + (p.source_found ? '' : ' missing');
    el.innerHTML = `<div>${p.label}</div><div class="meta">${p.clip_count} clip(s)` +
      (p.source_found ? '' : ' · source missing') + `</div>`;
    el.onclick = () => { document.querySelectorAll('.proj').forEach(e=>e.classList.remove('active')); el.classList.add('active'); loadProject(p.id); };
    sb.appendChild(el);
  }
}

async function loadProject(id) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading…</div>';
  const res = await fetch('/api/project?id=' + encodeURIComponent(id));
  const proj = await res.json();
  if (proj.error) { main.innerHTML = `<div class="empty">${proj.error}</div>`; return; }
  main.innerHTML = `<h2>${proj.label}</h2>` +
    `<p class="hint">${proj.content_mode} · ${proj.clips.length} clips · ${proj.transcript_word_count} transcript words` +
    (proj.source_found ? '' : ' · <b>source video not found</b>') + `</p>`;
  for (const c of proj.clips) {
    const div = document.createElement('div');
    div.className = 'clip';
    const segRows = c.segments.map((s,i)=>`<tr><td>${i+1}</td><td>${s.source_in.toFixed(2)}</td><td>${s.source_out.toFixed(2)}</td><td>${(s.source_out-s.source_in).toFixed(2)}s</td></tr>`).join('');
    div.innerHTML =
      `<h3>${c.title || c.clip_id}` + (c.uses_assets ? '<span class="badge">uses B-roll — render to confirm</span>' : '') + `</h3>` +
      `<div class="hint">${c.clip_id} · title card ${c.title_card_seconds.toFixed(1)}s · ${c.captions.length} captions</div>` +
      `<div class="players">` +
        (c.preview_url ? `<div><div class="hint">current render</div><video src="${c.preview_url}" controls preload="metadata"></video></div>` : '<div class="hint">no preview rendered yet</div>') +
        (proj.source_url ? `<div><div class="hint">source</div><video class="src" src="${proj.source_url}" controls preload="metadata"></video></div>` : '') +
      `</div>` +
      `<table><tr><th>#</th><th>in</th><th>out</th><th>len</th></tr>${segRows}</table>`;
    main.appendChild(div);
  }
}

loadProjects();
</script>
</body>
</html>
