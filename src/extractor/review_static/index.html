<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clipinator Review Editor</title>
<style>
  :root { --in:#dff3dd; --in-h:#bfe6ba; --accent:#3a5bd9; }
  body { font-family:-apple-system,system-ui,sans-serif; margin:0; color:#1a1a1a; background:#f4f4f6; }
  header { background:#1a1a2e; color:#fff; padding:.7rem 1.2rem; display:flex; align-items:center; gap:1rem; }
  header h1 { font-size:1.05rem; margin:0; }
  header .lib { font-size:.78rem; opacity:.7; margin-left:auto; }
  header .tabs { display:flex; gap:.3rem; }
  header .tab { background:transparent; color:#c9c9d6; border:1px solid #3a3a52; border-radius:6px; padding:.3rem .9rem; cursor:pointer; font-size:.85rem; }
  header .tab.active { background:#fafafa; color:#1a1a2e; border-color:#fafafa; font-weight:600; }
  .layout { display:flex; height:calc(100vh - 52px); }
  .sidebar { width:17rem; overflow-y:auto; background:#fff; border-right:1px solid #ddd; }
  .proj { padding:.65rem 1rem; border-bottom:1px solid #eee; cursor:pointer; font-size:.88rem; }
  .proj:hover { background:#eef2ff; } .proj.active { background:#dde6ff; }
  .proj .meta { font-size:.74rem; color:#888; } .proj.missing { color:#b00; }
  .proj.altvar { padding-left:1.6rem; background:#f7f7f7; } .proj.altvar:hover { background:#eef2ff; }
  .projctl { display:block; padding:.5rem 1rem; font-size:.78rem; color:#666; border-bottom:1px solid #eee; background:#fafafa; cursor:pointer; }
  main { flex:1; overflow-y:auto; padding:1rem 1.4rem 4rem; }
  .clip { background:#fff; border:1px solid #ddd; border-radius:8px; padding:1rem 1.2rem; margin-bottom:1.2rem; }
  .cliphead { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .cliphead input.title { font-size:1rem; font-weight:600; border:1px solid transparent; border-radius:4px; padding:.2rem .4rem; flex:1; min-width:12rem; }
  .cliphead input.title:hover, .cliphead input.title:focus { border-color:#ccc; background:#fafafa; }
  .badge { font-size:.7rem; background:#ffe9c7; color:#8a5a00; padding:.1rem .45rem; border-radius:999px; }
  .row { display:flex; gap:1.2rem; flex-wrap:wrap; align-items:flex-start; margin-top:.6rem; }
  .col { flex:1; min-width:18rem; }
  video { width:100%; max-width:300px; background:#000; border-radius:4px; }
  .phone { aspect-ratio:9/16; max-width:220px; background:#000; border-radius:10px; overflow:hidden; position:relative; }
  .phone video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; max-width:none; }
  .transport { display:flex; align-items:center; gap:.35rem; max-width:288px; margin-top:.4rem; }
  .transport button { border:1px solid #bbb; background:#fff; border-radius:5px; padding:.2rem .4rem; cursor:pointer; font-size:.8rem; white-space:nowrap; }
  .transport .trestart { padding:.2rem .35rem; }
  .pbar { flex:1; height:8px; background:#e4e4e4; border-radius:5px; cursor:pointer; overflow:hidden; }
  .pfill { height:100%; width:0; background:var(--accent); }
  .phone .cap { position:absolute; left:6%; right:6%; bottom:14%; text-align:center; color:#fff;
    font-weight:700; font-size:.8rem; text-shadow:0 1px 3px #000,0 0 6px #000; line-height:1.2; }
  .transcript { line-height:2; font-size:.95rem; margin-top:.4rem; max-height:22rem; overflow-y:auto;
    overscroll-behavior:contain; scroll-behavior:smooth;
    border:1px solid #ddd; border-radius:6px; padding:.5rem .7rem; background:#fcfcfc; }
  .w { cursor:pointer; padding:0 1px; border-radius:3px; }
  .w.in { background:var(--in); } .w.in:hover { background:var(--in-h); }
  .w.out { color:#bbb; text-decoration:line-through; } .w.out:hover { color:#666; }
  .controls { display:flex; gap:.7rem; align-items:center; margin-top:.8rem; padding-top:.7rem; border-top:1px solid #eee; flex-wrap:wrap; font-size:.85rem; }
  .expand { display:flex; gap:.5rem; align-items:center; margin-top:.5rem; font-size:.82rem; flex-wrap:wrap; }
  .expand button { border:1px solid #bbb; background:#fff; border-radius:5px; padding:.15rem .5rem; cursor:pointer; font-size:.78rem; }
  .expand button:disabled { opacity:.4; cursor:default; }
  .rework-row { display:flex; gap:.5rem; align-items:center; margin-top:.5rem; flex-wrap:wrap; }
  .rework-row .rwinstr { flex:1; min-width:18rem; font:inherit; font-size:.85rem; padding:.3rem .5rem; border:1px solid #ccc; border-radius:5px; }
  .rework-row .rwbtn, .rework-row .capbtn { border:1px solid #3a5bd9; color:#3a5bd9; background:#fff; border-radius:5px; padding:.3rem .7rem; cursor:pointer; font-size:.82rem; white-space:nowrap; }
  .rework-row .rwbtn:disabled, .rework-row .capbtn:disabled { opacity:.4; cursor:default; border-color:#bbb; color:#999; }
  .capstatus button { font:inherit; font-size:.78rem; padding:.1rem .5rem; margin-left:.2rem; border-radius:4px; cursor:pointer; border:1px solid #ccc; background:#fff; }
  .capstatus button.cfm-yes { border-color:#3a5bd9; color:#3a5bd9; }
  .framing { display:flex; align-items:center; gap:.4rem; margin-top:.4rem; }
  .framing input[type=range] { flex:1; max-width:130px; }
  .framing button { border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer; padding:0 .45rem; line-height:1.6; }
  .framing .fr-val { min-width:4.5rem; }
  .fr-note { font-size:.74rem; color:#9a9a9a; margin-top:.1rem; }
  .rwstatus button { font:inherit; font-size:.78rem; padding:.1rem .5rem; margin-left:.2rem; border-radius:4px; cursor:pointer; border:1px solid #ccc; background:#fff; }
  .rwstatus button.cfm-yes { border-color:#3a5bd9; color:#3a5bd9; }
  .filepath { font-size:.72rem; color:#999; word-break:break-all; margin-top:.15rem; font-family:ui-monospace,Menlo,monospace; }
  .cardrow { display:flex; align-items:center; gap:.5rem; margin-top:.3rem; flex-wrap:wrap; }
  .cardrow .cardtext { flex:1; min-width:14rem; font:inherit; font-size:.9rem; padding:.25rem .45rem; border:1px solid #ccc; border-radius:5px; }
  textarea.notes { width:100%; min-height:2.5rem; margin-top:.4rem; font:inherit; font-size:.85rem; }
  .hint { color:#777; font-size:.82rem; }
  button.saveclip { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.45rem 1.1rem; font-size:.88rem; cursor:pointer; }
  button.saveclip:disabled { opacity:.5; cursor:default; }
  .controls button.render { border:1px solid #bbb; background:#fff; border-radius:6px; padding:.45rem 1rem; cursor:pointer; font-size:.85rem; }
  .controls button.render:disabled { opacity:.5; cursor:default; }
  .empty { color:#777; padding:2rem; }
  /* --- Storyboard prototype --- */
  .sb-clips { display:flex; gap:.4rem; flex-wrap:wrap; margin:.2rem 0 1rem; }
  .sb-pill { border:1px solid #bbb; background:#fff; border-radius:999px; padding:.25rem .8rem; cursor:pointer; font-size:.82rem; }
  .sb-pill.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .sb-top { display:flex; gap:1.2rem; align-items:stretch; flex-wrap:wrap; }
  .sb-tx-panel, .sb-src-panel { flex:1; min-width:20rem; }
  .sb-tx { max-height:20rem; margin-top:.3rem; }
  .sb-src-panel video { width:100%; max-width:100%; aspect-ratio:16/9; }
  .sb-srcclock { margin-top:.25rem; font-family:ui-monospace,Menlo,monospace; }
  .sb-tl-wrap { margin-top:1.1rem; }
  .sb-timeline { display:flex; gap:5px; overflow-x:auto; padding:.55rem 0; align-items:stretch;
    border-top:1px solid #e4e4e4; border-bottom:1px solid #e4e4e4; }
  .sb-unit { flex:0 0 auto; min-width:70px; max-width:260px; box-sizing:border-box; border:1px solid #ccc;
    border-radius:6px; background:#fafafa; padding:.35rem .5rem; cursor:pointer; font-size:.74rem;
    line-height:1.25; color:#555; user-select:none; transition:background .08s; }
  .sb-unit:hover { border-color:#999; background:#eef2ff; }
  .sb-unit.sel { background:var(--in); border-color:#7fbf78; color:#1a1a1a; }
  .sb-unit.sel:hover { background:var(--in-h); }
  .sb-unit.now { box-shadow:0 0 0 2px var(--accent); }
  .sb-unit .ut { display:block; font-size:.66rem; color:#9a9a9a; margin-bottom:.15rem; font-family:ui-monospace,Menlo,monospace; }
  .sb-unit.sel .ut { color:#4a7a44; }
  /* karaoke word highlight synced to the source video playhead */
  .sb-tx .w.spoken { background:#ffd34d; color:#1a1a1a; text-decoration:none; box-shadow:0 0 0 2px #ffd34d; }
  .sb-bottom { margin-top:1.3rem; }
</style>
</head>
<body>
<header><h1>Clipinator Review Editor</h1>
  <div class="tabs">
    <button class="tab active" data-mode="review">Review clips</button>
    <button class="tab" data-mode="pick">Pick clips</button>
    <button class="tab" data-mode="storyboard">Storyboard</button>
  </div>
  <div class="lib" id="lib"></div></header>
<div class="layout">
  <div class="sidebar" id="sidebar"><div class="empty">Loading…</div></div>
  <main id="main"><div class="empty">Select a project on the left.</div></main>
</div>
<script>
let CURRENT = null;            // current project detail
let FFMPEG = false;            // whether ffmpeg is available for in-app render
let AI = false;                // whether OPENAI key is available for AI rework
let MODE = 'review';           // 'review' (adjust AI clips) or 'pick' (author from source)
let ACTIVE_PID = null;         // selected project id (source + transcript)

// Open the selected source in the active mode. Review = adjust the AI clips;
// Pick = author a new clip from the full transcript.
function openProject(id){
  ACTIVE_PID = id;
  if(MODE === 'pick') loadPickProject(id);
  else if(MODE === 'storyboard') loadStoryboardProject(id);
  else loadProject(id);
}
function setMode(m){
  MODE = m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.mode===m));
  if(ACTIVE_PID) openProject(ACTIVE_PID);
  else document.getElementById('main').innerHTML='<div class="empty">Select a source on the left.</div>';
}
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const fmt1 = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor((s%1)*10)}`;

let ALLPROJ=[], SHOWALL=false;
async function loadProjects(){
  const d = await (await fetch('/api/projects')).json();
  FFMPEG = !!d.ffmpeg; AI = !!d.ai; ALLPROJ = d.projects||[];
  document.getElementById('lib').textContent = 'Library: ' + d.library + (FFMPEG?'':'  (ffmpeg not found — preview only)') + (AI?'':'  (no AI key — rework off)');
  renderProjectList();
}

// Show only the most-refined variant per run by default (drafts/intermediates
// hide behind a toggle), so the list isn't cluttered with earlier pipeline cuts.
function renderProjectList(){
  const sb = document.getElementById('sidebar');
  if(!ALLPROJ.length){ sb.innerHTML='<div class="empty">No projects found. Drag a project folder onto the launcher.</div>'; return; }
  const hidden = ALLPROJ.filter(p=>!p.preferred).length;
  sb.innerHTML='';
  if(hidden){
    const ctl=document.createElement('label'); ctl.className='projctl';
    ctl.innerHTML=`<input type="checkbox" ${SHOWALL?'checked':''}> show all variants (${hidden} earlier hidden)`;
    ctl.querySelector('input').onchange=e=>{ SHOWALL=e.target.checked; renderProjectList(); };
    sb.appendChild(ctl);
  }
  for(const p of (SHOWALL?ALLPROJ:ALLPROJ.filter(p=>p.preferred))){
    const el=document.createElement('div');
    el.className='proj'+(p.source_found?'':' missing')+(p.preferred?'':' altvar');
    el.innerHTML=`<div>${p.label}</div><div class="meta">${p.clip_count} clip(s)${p.source_found?'':' · source missing'}</div>`;
    el.onclick=()=>{document.querySelectorAll('.proj').forEach(e=>e.classList.remove('active'));el.classList.add('active');openProject(p.id);};
    sb.appendChild(el);
  }
}

async function loadProject(id){
  const main=document.getElementById('main'); main.innerHTML='<div class="empty">Loading…</div>';
  const proj = await (await fetch('/api/project?id='+encodeURIComponent(id))).json();
  if(proj.error){ main.innerHTML=`<div class="empty">${proj.error}</div>`; return; }
  CURRENT = proj;
  const W = proj.transcript_words || []; CURRENT.W = W;
  CURRENT.tend = W.length ? W[W.length-1].end : 0;
  // Each clip's edit state: a Set of GLOBAL word indices that are "in", seeded
  // from its segments, plus a visible window over the full transcript that the
  // editor can expand earlier/later to reach content beyond the clip.
  proj.clips.forEach(c=>{
    c.decision='keep';
    c.framing=+c.framing_offset||0;
    c.cardText=c.title_card_text||'';
    c.inSet=new Set();
    for(let i=0;i<W.length;i++){
      if((c.segments||[]).some(s=>s.source_in-1e-6<=W[i].start && W[i].start<=s.source_out+1e-6)) c.inSet.add(i);
    }
    const lo=(c.segments&&c.segments.length)?Math.min(...c.segments.map(s=>s.source_in)):0;
    const hi=(c.segments&&c.segments.length)?Math.max(...c.segments.map(s=>s.source_out)):CURRENT.tend;
    c.win=[Math.max(0,lo-4), Math.min(CURRENT.tend,hi+4)];
  });
  main.innerHTML = `<h2>${proj.label}</h2><p class="hint">${proj.content_mode} · ${proj.clips.length} clips · ${proj.transcript_word_count} transcript words${proj.source_found?'':' · <b>source video not found</b>'}</p>`;
  proj.clips.forEach((c,i)=>main.appendChild(renderClip(c,i)));
}

// Pick mode: author a brand-new clip from the full source transcript. One blank
// card with nothing selected; the user highlights words to build the clip, then
// previews / exports metadata / renders it (synthesized server-side).
async function loadPickProject(id){
  const main=document.getElementById('main'); main.innerHTML='<div class="empty">Loading…</div>';
  const proj = await (await fetch('/api/project?id='+encodeURIComponent(id))).json();
  if(proj.error){ main.innerHTML=`<div class="empty">${proj.error}</div>`; return; }
  CURRENT = proj;
  const W = proj.transcript_words || []; CURRENT.W = W;
  CURRENT.tend = W.length ? W[W.length-1].end : 0;
  main.innerHTML = `<h2>${proj.label} — pick a clip</h2><p class="hint">Highlight words in the full transcript to build a new clip, then preview, export metadata, or render it.${proj.source_found?'':' · <b>source video not found</b>'}</p>`;
  main.appendChild(renderClip(newPickClip(), 0));
}

function newPickClip(){
  return {clip_id:'pick', _pick:true, title:'', title_card_text:'', cardText:'',
          title_card_seconds:4.5, segments:[], framing_offset:0, framing:0, decision:'keep',
          preview_url:null, output_path:null, uses_assets:false,
          inSet:new Set(), win:[0, CURRENT.tend]};
}

function clearPick(div,c){
  c.inSet=new Set(); c.win=[0, CURRENT.tend]; c.framing=0; c.captions=null; c.title=''; c.cardText='';
  div.querySelector('.title').value=''; div.querySelector('.cardtext').value='';
  renderWords(div,c); applyFraming(div,c); updateSegInfo(div,c);
  div.querySelector('.savestatus').textContent=''; div.querySelector('.renderstatus').textContent='';
}

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function inWords(c){ return [...c.inSet].sort((a,b)=>a-b).map(i=>CURRENT.W[i]); }

function currentSegments(c){
  // contiguous runs of GLOBAL in-word indices -> segments (snap to word edges)
  const idx=[...c.inSet].sort((a,b)=>a-b); const segs=[]; let run=null, prev=null;
  for(const i of idx){ const w=CURRENT.W[i];
    if(run && prev===i-1){ run.source_out=w.end; }
    else { if(run) segs.push(run); run={source_in:w.start,source_out:w.end}; }
    prev=i;
  }
  if(run) segs.push(run);
  return segs;
}

function renderWords(div,c){
  const W=CURRENT.W, t=div.querySelector('.transcript');
  let html=''; let any=false;
  for(let i=0;i<W.length;i++){
    const w=W[i];
    if(w.end<c.win[0] || w.start>c.win[1]) continue;
    any=true;
    html+=`<span class="w ${c.inSet.has(i)?'in':'out'}" data-i="${i}" title="source ${fmt1(w.start)}">${esc(w.text)}</span> `;
  }
  t.innerHTML=html||'<span class="hint">no transcript words here</span>';
  t.querySelectorAll('.w').forEach(sp=>{
    sp.onclick=()=>{ const i=+sp.dataset.i; if(c.inSet.has(i)) c.inSet.delete(i); else c.inSet.add(i);
      sp.className='w '+(c.inSet.has(i)?'in':'out'); c.captions=null; updateSegInfo(div,c); };
  });
  const atStart=c.win[0]<=0, atEnd=c.win[1]>=CURRENT.tend;
  div.querySelector('.earlier').disabled=atStart;
  div.querySelector('.later').disabled=atEnd;
  div.querySelector('.wininfo').textContent=`showing ${fmt(c.win[0])}–${fmt(c.win[1])} of ${fmt(CURRENT.tend)}`;
}

function renderClip(c,idx){
  const div=document.createElement('div'); div.className='clip'; div.dataset.idx=idx;
  div.innerHTML=`
    <div class="cliphead">
      <input class="title" value="${esc(c.title || (c._pick?'':c.clip_id))}" placeholder="${c._pick?'Title (optional)':''}" title="headline title (clip name)">
      ${c.uses_assets?'<span class="badge">uses B-roll — render to confirm</span>':''}
    </div>
    <div class="hint filepath" title="rendered clip file">${esc(c.output_path||'(not rendered yet)')}</div>
    <div class="cardrow"><label class="hint">title card text</label>
      <input class="cardtext" value="${esc(c.cardText||'')}" placeholder="(uses the title)" title="text shown on the opening title card">
      <span class="hint">· card ${c.title_card_seconds.toFixed(1)}s · ${c.clip_id}</span>
    </div>
    <div class="expand">
      <button class="earlier" title="reveal earlier transcript">⟵ 30s earlier</button>
      <button class="later" title="reveal later transcript">30s later ⟶</button>
      <span class="hint wininfo"></span>
      <span class="hint">· click words to include/exclude them in the clip</span>
    </div>
    <div class="transcript"></div>
    <div class="segtimes hint"></div>
    <div class="rework-row">
      <input class="rwinstr" placeholder="tell the AI how to change this cut — e.g. 'tighten the middle', 'start at the question', 'cut the aside about Wagner'">
      <button class="rwbtn">rework with AI</button>
      <span class="hint rwstatus"></span>
    </div>
    <div class="rework-row cap-row">
      <button class="capbtn" title="Fix ASR errors, stutters, and punctuation — faithfully">fix captions with AI</button>
      <span class="hint capstatus"></span>
    </div>
    <textarea class="notes" placeholder="Notes for a rework pass (optional)…"></textarea>
    <div class="row">
      <div class="col"><div class="hint">current render</div>${c.preview_url?`<video src="${c.preview_url}" controls preload="metadata"></video>`:'<div class="hint">not rendered yet</div>'}</div>
      <div class="col"><div class="hint">cut preview (9:16, approximate · with audio)</div>
        <div class="phone"><video class="pv" playsinline preload="metadata"></video><div class="cap"></div></div>
        <div class="transport"><button class="tplay" title="play/pause">▶</button><button class="trestart" title="back to clip start">⏮ start</button><button class="tstepb" title="back one frame">◀ǀ</button><button class="tstepf" title="forward one frame">ǀ▶</button><div class="pbar"><div class="pfill"></div></div></div>
        <div class="clock pvclock hint">source —:— · cut —:—</div>
        <div class="framing">
          <span class="hint">Framing</span>
          <button class="fr-left" title="shift crop left">◀</button>
          <input class="fr-slider" type="range" min="-0.4" max="0.4" step="0.05" value="0">
          <button class="fr-right" title="shift crop right">▶</button>
          <span class="hint fr-val">centered</span>
        </div>
        <div class="hint fr-note">tip: pause or step (◀ǀ ǀ▶) to a frame, then adjust · preview approximate — render to confirm</div>
      </div>
    </div>
    <div class="controls">
      <button class="render" title="Render this clip with ffmpeg (true final look)">render this clip</button>
      <button class="saveclip" title="Write this clip's edit decisions to the plan (no video)">export metadata</button>
      ${c._pick?'<button class="clearpick" title="Start a new pick">clear</button>':''}
      <span class="hint seginfo"></span>
      <span class="hint renderstatus"></span>
      <span class="hint savestatus"></span>
    </div>`;

  // transcript window + expand controls
  renderWords(div,c);
  // Expanding the window re-renders the transcript (resetting its scroll), so
  // scroll to the side that grew — otherwise the new words land off-screen and
  // the button looks like it did nothing.
  div.querySelector('.earlier').onclick=()=>{ c.win[0]=Math.max(0,c.win[0]-30); renderWords(div,c); div.querySelector('.transcript').scrollTop=0; };
  div.querySelector('.later').onclick=()=>{ c.win[1]=Math.min(CURRENT.tend,c.win[1]+30); renderWords(div,c); const t=div.querySelector('.transcript'); t.scrollTop=t.scrollHeight; };
  // title/notes
  div.querySelector('.title').oninput=e=>{ c.title=e.target.value; };
  div.querySelector('.cardtext').oninput=e=>{ c.cardText=e.target.value; };
  div.querySelector('.notes').oninput=e=>{ c.notes=e.target.value; };
  div.querySelector('.saveclip').onclick=()=>saveClip(div,c);
  if(c._pick) div.querySelector('.clearpick').onclick=()=>clearPick(div,c);
  // cut-confined transport (play/pause/restart/scrub within the clip)
  setupPreview(div,c);
  // framing: horizontal crop nudge (biases the renderer's subject-crop center)
  const fs=div.querySelector('.fr-slider'); fs.value=c.framing;
  const nudge=v=>{ c._pausePreview&&c._pausePreview(); c.framing=v; applyFraming(div,c); };
  fs.oninput=()=>nudge(+fs.value);
  div.querySelector('.fr-left').onclick=()=>nudge(Math.max(-0.4,+(c.framing-0.05).toFixed(2)));
  div.querySelector('.fr-right').onclick=()=>nudge(Math.min(0.4,+(c.framing+0.05).toFixed(2)));
  applyFraming(div,c);
  // render this clip for real (ffmpeg) — gated on availability
  const rb=div.querySelector('.render');
  if(!FFMPEG){ rb.disabled=true; rb.title='Install ffmpeg to render finals here'; }
  rb.onclick=()=>renderClipNow(div,c);
  // AI rework — gated on an OPENAI key
  const rw=div.querySelector('.rwbtn');
  if(!AI){ rw.disabled=true; rw.title='Set OPENAI_API_KEY in .env to enable AI rework';
    div.querySelector('.rwinstr').disabled=true; }
  rw.onclick=()=>reworkClip(div,c);
  div.querySelector('.rwinstr').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); reworkClip(div,c); } });
  // AI caption cleanup — same key gate + cost guardrail
  const cb=div.querySelector('.capbtn');
  if(!AI){ cb.disabled=true; cb.title='Set OPENAI_API_KEY in .env to enable AI caption cleanup'; }
  cb.onclick=()=>cleanupCaptions(div,c);
  updateSegInfo(div,c);
  return div;
}

// Approximate the horizontal reframe in the preview by shifting which part of
// the cover-cropped video shows. Truth comes from "render this clip".
function applyFraming(div,c){
  const pv=div.querySelector('.pv');
  if(pv) pv.style.objectPosition=(50+c.framing*125).toFixed(0)+'% 50%';
  const s=div.querySelector('.fr-slider'); if(s && +s.value!==c.framing) s.value=c.framing;
  const v=div.querySelector('.fr-val');
  if(v) v.textContent = Math.abs(c.framing)<0.001 ? 'centered'
        : Math.round(Math.abs(c.framing)*100)+'% '+(c.framing<0?'left':'right');
}

function updateSegInfo(div,c){
  const segs=currentSegments(c);
  const total=segs.reduce((a,s)=>a+(s.source_out-s.source_in),0)+c.title_card_seconds;
  const info=div.querySelector('.seginfo');
  if(info) info.textContent=`${segs.length} segment(s), ~${total.toFixed(1)}s`;
  const cuts=segs.map(s=>`${fmt(s.source_in)}–${fmt(s.source_out)}`).join('  ');
  const st=div.querySelector('.segtimes');
  if(st) st.textContent = cuts ? 'source cuts: '+cuts : '';
}

// Captions ARE the in-words in transcript-first editing — derive them live from
// the current selection so newly-included dialogue shows up immediately.
function currentCaptions(c){
  const MAXC=42, MAXW=7, GAP=0.9, TAIL=0.15;
  const caps=[]; let line=[];
  const flush=()=>{ if(line.length){ caps.push({source_start:line[0].start,
    source_end:line[line.length-1].end+TAIL, text:line.map(w=>w.text).join(' ')}); line=[]; } };
  for(const w of inWords(c)){
    if(line.length){
      const chars=line.map(x=>x.text).join(' ').length+1+w.text.length;
      const gap=w.start-line[line.length-1].end;
      if(chars>MAXC || line.length>=MAXW || gap>GAP) flush();
    }
    line.push(w);
  }
  flush(); return caps;
}

// Cleaned (AI) captions when present, else the live transcript-derived ones.
// Cleaned captions are cleared whenever the word selection changes (see
// renderWords / applySegments) so they never drift out of sync with the cut.
function activeCaptions(c){
  return (c.captions && c.captions.length) ? c.captions : currentCaptions(c);
}

// A transport over the CUT timeline (not the source): playback is clamped to
// the selected segments so it can never run into the rest of the video, with
// play/pause, restart, and a clickable cut progress bar.
function setupPreview(div,c){
  const v=div.querySelector('.pv'), cap=div.querySelector('.cap'), clk=div.querySelector('.pvclock');
  const playBtn=div.querySelector('.tplay'), pfill=div.querySelector('.pfill'), pbar=div.querySelector('.pbar');
  let segs=[], before=[], total=0, caps=[], i=0, finished=false;
  const rebuild=()=>{ segs=currentSegments(c); before=[]; let acc=0; for(const s of segs){before.push(acc);acc+=s.source_out-s.source_in;} total=acc; caps=activeCaptions(c); };
  const ensureSrc=()=>{ if(CURRENT.source_url && v.src!==location.origin+CURRENT.source_url) v.src=CURRENT.source_url; };
  const showAt=(t,cut)=>{ const line=caps.find(x=>x.source_start<=t&&t<=x.source_end); cap.textContent=line?line.text:''; clk.textContent=`source ${fmt1(t)} · cut ${fmt1(cut)} / ${fmt1(total)}`; pfill.style.width=(100*cut/Math.max(total,0.01))+'%'; };
  function seekCut(t){ if(!segs.length) return; t=Math.max(0,Math.min(t,total-0.01)); let idx=0; while(idx<segs.length-1 && t>=before[idx]+(segs[idx].source_out-segs[idx].source_in)) idx++; i=idx; finished=false; v.currentTime=segs[idx].source_in+(t-before[idx]); showAt(v.currentTime,t); }
  function start(){ if(!CURRENT.source_url){ alert('Source video not found, cannot preview.'); return; } rebuild(); if(!segs.length){ alert('No words selected.'); return; } ensureSrc(); i=0; finished=false; v.currentTime=segs[0].source_in; v.play(); }
  function toggle(){ if(!segs.length||v.src===''){ start(); return; } if(v.paused){ if(finished) start(); else v.play(); } else v.pause(); }
  v.onplay=()=>{ playBtn.textContent='⏸'; };
  v.onpause=()=>{ playBtn.textContent='▶'; };
  v.ontimeupdate=()=>{
    if(!segs.length) return;
    let s=segs[i]; if(!s){ v.pause(); return; }
    if(v.currentTime>=s.source_out-0.001){
      i++;
      if(i>=segs.length){ finished=true; v.pause(); cap.textContent=''; pfill.style.width='100%'; clk.textContent=`source ${fmt1(s.source_out)} · cut ${fmt1(total)} / ${fmt1(total)}`; return; }
      v.currentTime=segs[i].source_in; s=segs[i];
    }
    showAt(v.currentTime, before[i]+(v.currentTime-s.source_in));
  };
  // Land on a still without playing: ensure the source is loaded + the cut is
  // built, then pause so framing can be judged frame-by-frame.
  const curCut=()=>{ const s=segs[i]; return s ? before[i]+(v.currentTime-s.source_in) : 0; };
  const armStill=()=>{ ensureSrc(); if(!segs.length) rebuild(); v.pause(); };
  const STEP=1/24;  // ~one frame
  function step(delta){ armStill(); if(!segs.length) return; const cut = finished ? total : curCut(); finished=false; seekCut(cut+delta); }
  playBtn.onclick=toggle;
  div.querySelector('.trestart').onclick=start;
  div.querySelector('.tstepb').onclick=()=>step(-STEP);
  div.querySelector('.tstepf').onclick=()=>step(STEP);
  pbar.onclick=e=>{ armStill(); const r=pbar.getBoundingClientRect(); seekCut((e.clientX-r.left)/r.width*total); };
  // let the framing controls freeze the preview on the current frame
  c._pausePreview=()=>{ if(!v.paused) v.pause(); };
}

function applySegments(c, segs){
  c.captions=null;  // selection changed — cleaned captions would drift, revert to auto
  c.inSet=new Set();
  for(let i=0;i<CURRENT.W.length;i++){
    const w=CURRENT.W[i];
    if(segs.some(s=>s.source_in-1e-6<=w.start && w.start<=s.source_out+1e-6)) c.inSet.add(i);
  }
}

// Rough pre-call estimate, mirroring the server's neighborhood (words within
// ±45s of the current segments) so the confirm shows a realistic ballpark. The
// real charge is reported from the response after the call.
function estimateReworkUsd(c){
  const segs=currentSegments(c); if(!segs.length) return 0;
  const lo=Math.min(...segs.map(s=>s.source_in))-45, hi=Math.max(...segs.map(s=>s.source_out))+45;
  let n=0; for(const w of CURRENT.W){ if(w.end>=lo && w.start<=hi) n++; }
  // ~1.8 tok/word covers the numbered-sentence scaffolding (indices+timestamps);
  // lean slightly high so the estimate is a ceiling, not a floor.
  return (n*1.8+600)/1e6*5 + 600/1e6*30;
}
const fmtUsdEst=x=> x<0.01 ? '<$0.01' : '$'+x.toFixed(2);
const fmtUsd=x=> '$'+(+x).toFixed(4);

// Confirm before spending: AI rework is a live billable call, so gate it behind
// an inline confirmation (never window.confirm — that blocks the extension).
function reworkClip(div,c){
  if(!AI) return;
  const instr=div.querySelector('.rwinstr').value.trim();
  const status=div.querySelector('.rwstatus');
  if(!instr){ status.textContent='Type an instruction first.'; return; }
  const segs=currentSegments(c);
  if(!segs.length){ status.textContent='Select some words first so the AI has a starting cut.'; return; }
  status.innerHTML=`Live AI call, ~${fmtUsdEst(estimateReworkUsd(c))} est. — <button class="cfm-yes">Confirm</button> <button class="cfm-no">Cancel</button>`;
  status.querySelector('.cfm-yes').onclick=()=>doRework(div,c,instr);
  status.querySelector('.cfm-no').onclick=()=>{ status.textContent='Cancelled — no call made.'; };
}

async function doRework(div,c,instr){
  const status=div.querySelector('.rwstatus');
  const btn=div.querySelector('.rwbtn'); btn.disabled=true; status.textContent='Asking the AI…';
  try{
    const res=await fetch('/api/rework',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project_id:CURRENT.id, clip_id:c.clip_id, instruction:instr, segments:currentSegments(c)})});
    const d=await res.json();
    if(d.error){ status.textContent='Error: '+d.error; return; }
    if(!d.segments||!d.segments.length){ status.textContent='AI returned an empty cut — left unchanged.'; return; }
    applySegments(c, d.segments);
    c.win=[Math.max(0,Math.min(...d.segments.map(s=>s.source_in))-4),
           Math.min(CURRENT.tend, Math.max(...d.segments.map(s=>s.source_out))+4)];
    renderWords(div,c); updateSegInfo(div,c);
    const k=d.cost||{};
    const costStr = k.estimated_usd!=null
      ? ` · cost ${fmtUsd(k.estimated_usd)} (${(k.input_tokens||0).toLocaleString()} in / ${(k.output_tokens||0).toLocaleString()} out)`
      : '';
    status.textContent='AI updated the cut ✓ — review and tweak'+(d.note?(' · '+d.note):'')+costStr;
  }catch(e){ status.textContent='Error: '+e; }
  finally{ btn.disabled=false; }
}

// Caption cleanup cost ≈ input (caption text + overhead) + output (one cleaned
// line per input, so output ~ input text). Lean high.
function estimateCaptionUsd(c){
  const n=inWords(c).length; if(!n) return 0;
  const inTok=n*1.6+400, outTok=n*1.6+200;
  return inTok/1e6*5 + outTok/1e6*30;
}

function cleanupCaptions(div,c){
  if(!AI) return;
  const status=div.querySelector('.capstatus');
  if(!inWords(c).length){ status.textContent='Select some words first so there are captions to clean.'; return; }
  status.innerHTML=`Live AI call, ~${fmtUsdEst(estimateCaptionUsd(c))} est. — <button class="cfm-yes">Confirm</button> <button class="cfm-no">Cancel</button>`;
  status.querySelector('.cfm-yes').onclick=()=>doCleanup(div,c);
  status.querySelector('.cfm-no').onclick=()=>{ status.textContent='Cancelled — no call made.'; };
}

async function doCleanup(div,c){
  const status=div.querySelector('.capstatus');
  const btn=div.querySelector('.capbtn'); btn.disabled=true; status.textContent='Cleaning captions…';
  try{
    const res=await fetch('/api/caption-cleanup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project_id:CURRENT.id, clip_id:c.clip_id, segments:currentSegments(c)})});
    const d=await res.json();
    if(d.error){ status.textContent='Error: '+d.error; return; }
    c.captions=(d.captions||[]).map(x=>({source_start:x.source_start, source_end:x.source_end, text:x.text}));
    const k=d.cost||{};
    const costStr = k.estimated_usd!=null
      ? ` · cost ${fmtUsd(k.estimated_usd)} (${(k.input_tokens||0).toLocaleString()} in / ${(k.output_tokens||0).toLocaleString()} out)`
      : '';
    status.innerHTML=`Captions cleaned ✓ — ${d.changed||0} line(s) changed${d.summary?(' · '+esc(d.summary)):''}${costStr} <button class="cfm-no">revert to verbatim</button>`;
    status.querySelector('.cfm-no').onclick=()=>{ c.captions=null; status.textContent='Reverted to verbatim captions.'; };
  }catch(e){ status.textContent='Error: '+e; }
  finally{ btn.disabled=false; }
}

function clipPayload(c){
  // Captions are normally regenerated server-side from the kept words. We only
  // send them when AI cleanup has produced human-edited caption text, which the
  // backend then locks in (human_edited_captions) so it actually renders.
  const p={clip_id:c.clip_id, decision:c.decision||'keep',
           title:c.title || (c._pick ? '' : c.clip_id),
           title_card_text:(c.cardText||'').trim(),
           title_card_seconds:c.title_card_seconds, notes:c.notes||'',
           framing_offset:+c.framing||0,
           segments: c.decision==='drop'?[]:currentSegments(c)};
  if(c.captions && c.captions.length && c.decision!=='drop') p.captions=c.captions;
  return p;
}

async function renderClipNow(div,c){
  const status=div.querySelector('.renderstatus');
  const btn=div.querySelector('.render'); btn.disabled=true;
  status.textContent='Saving + rendering… (about a minute)';
  try{
    if(c._pick && !currentSegments(c).length){ status.textContent='Highlight some words first.'; btn.disabled=false; return; }
    const url=c._pick?'/api/pick-render':'/api/render';
    const body=c._pick?{project_id:CURRENT.id, clip:clipPayload(c)}
                      :{project_id:CURRENT.id, clip_id:c.clip_id, clips:[clipPayload(c)]};
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await res.json();
    if(d.error){ status.textContent='Error: '+d.error; btn.disabled=false; return; }
    const poll=async()=>{
      const s=await (await fetch('/api/render-status?job='+d.job_id)).json();
      if(s.status==='running'){ status.textContent='Rendering…'; setTimeout(poll,2000); return; }
      btn.disabled=false;
      if(s.status==='done' && s.output_url){
        status.textContent='Rendered ✓';
        const vid=div.querySelector('.row .col video'); // the "current render" player
        if(vid){ vid.src=s.output_url + '&t=' + Date.now(); }
        else { // no prior preview element; insert one
          const col=div.querySelector('.row .col');
          col.innerHTML='<div class="hint">current render</div><video src="'+s.output_url+'" controls preload="metadata"></video>';
        }
      } else { status.textContent='Error: '+(s.message||'render failed'); }
    };
    poll();
  }catch(e){ status.textContent='Error: '+e; btn.disabled=false; }
}

// Per-clip save: send only this clip's edits. The server merges them onto the
// existing human plan, so other clips' saved edits are preserved.
async function saveClip(div,c){
  if(!CURRENT) return;
  const status=div.querySelector('.savestatus');
  const btn=div.querySelector('.saveclip'); btn.disabled=true; status.textContent='Exporting…';
  try{
    if(c._pick && !currentSegments(c).length){ status.textContent='Highlight some words first.'; return; }
    const url=c._pick?'/api/pick-save':'/api/save';
    const body=c._pick?{project_id:CURRENT.id, clip:clipPayload(c)}
                      :{project_id:CURRENT.id, clips:[clipPayload(c)]};
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await res.json();
    if(d.error){ status.textContent='Error: '+d.error; return; }
    status.textContent='Exported ✓'+(d.clip_id?(' ('+d.clip_id+')'):'');
  }catch(e){ status.textContent='Error: '+e; }
  finally{ btn.disabled=false; }
}
// ------------------------------------------------------------------ Storyboard
// A prototype UX: transcript beside the source video, a source timeline of
// logical content units (each a several-word summary) that you click to
// include/exclude in the current clip, and the render + cut preview below.
// No free-form AI entry — selection is direct manipulation on units/words.

// Map each transcript word to the content unit whose time span contains it.
function computeUnitWords(){
  const U=CURRENT.U||[], W=CURRENT.W||[];
  const uw=U.map(()=>[]);
  let u=0;
  for(let i=0;i<W.length;i++){
    const t=W[i].start;
    while(u<U.length-1 && t>U[u].end+1e-6) u++;
    if(U.length && t>=U[u].start-1e-6 && t<=U[u].end+1e-6) uw[u].push(i);
  }
  CURRENT.unitWords=uw;
}
// A unit counts as selected when a majority of its words are in the cut.
function unitSelected(c,u){
  const idxs=CURRENT.unitWords[u]||[]; if(!idxs.length) return false;
  let n=0; for(const i of idxs) if(c.inSet.has(i)) n++;
  return n*2>=idxs.length;
}

async function loadStoryboardProject(id){
  const main=document.getElementById('main'); main.innerHTML='<div class="empty">Loading…</div>';
  const proj=await (await fetch('/api/project?id='+encodeURIComponent(id))).json();
  if(proj.error){ main.innerHTML=`<div class="empty">${proj.error}</div>`; return; }
  CURRENT=proj;
  const W=proj.transcript_words||[]; CURRENT.W=W; CURRENT.U=proj.transcript_units||[];
  CURRENT.tend=W.length?W[W.length-1].end:0;
  proj.clips.forEach(c=>{
    c.decision='keep'; c.framing=+c.framing_offset||0; c.cardText=c.title_card_text||'';
    c.inSet=new Set();
    for(let i=0;i<W.length;i++){
      if((c.segments||[]).some(s=>s.source_in-1e-6<=W[i].start && W[i].start<=s.source_out+1e-6)) c.inSet.add(i);
    }
  });
  computeUnitWords();
  if(!proj.clips.length){
    main.innerHTML='<div class="empty">This project has no clips to storyboard. Use “Pick clips” to author one from scratch.</div>';
    return;
  }
  if(CURRENT.sbIdx==null || CURRENT.sbIdx>=proj.clips.length) CURRENT.sbIdx=0;
  renderStoryboardShell();
}

function renderStoryboardShell(){
  const proj=CURRENT, main=document.getElementById('main');
  main.innerHTML=`<h2>${esc(proj.label)} — storyboard</h2>
    <p class="hint">${proj.content_mode} · ${proj.clips.length} clip(s) · ${(proj.U||[]).length} content units${proj.source_found?'':' · <b>source video not found</b>'}</p>
    <div class="sb-clips"></div><div id="sbbody"></div>`;
  const pills=main.querySelector('.sb-clips');
  if(proj.clips.length>1){
    proj.clips.forEach((c,i)=>{
      const b=document.createElement('button');
      b.className='sb-pill'+(i===proj.sbIdx?' active':'');
      b.textContent=c.title||c.clip_id;
      b.onclick=()=>{ proj.sbIdx=i; renderStoryboardShell(); };
      pills.appendChild(b);
    });
  }
  const body=document.getElementById('sbbody');
  body.appendChild(renderStoryboard(proj.clips[proj.sbIdx], proj.sbIdx));
}

function renderStoryboard(c,idx){
  const div=document.createElement('div'); div.className='sb clip'; div.dataset.idx=idx;
  div.innerHTML=`
    <div class="cardrow">
      <label class="hint">title card</label>
      <input class="cardtext" value="${esc(c.cardText||'')}" placeholder="${esc(c.title||'(uses the title)')}" title="text shown on the opening title card">
      <span class="hint">· card ${c.title_card_seconds.toFixed(1)}s · ${esc(c.clip_id)}</span>
    </div>
    <div class="sb-top">
      <div class="sb-tx-panel">
        <div class="hint">transcript — click a word for fine control</div>
        <div class="transcript sb-tx"></div>
      </div>
      <div class="sb-src-panel">
        <div class="hint">source video</div>
        ${CURRENT.source_url?`<video class="sb-src" controls preload="metadata" src="${CURRENT.source_url}"></video>`:'<div class="hint">source video not found</div>'}
        <div class="hint sb-srcclock">source —:—</div>
      </div>
    </div>
    <div class="sb-tl-wrap">
      <div class="hint">source timeline — each block is a content unit; click to include/exclude it in this clip · <span class="seginfo"></span></div>
      <div class="sb-timeline"></div>
    </div>
    <div class="row sb-bottom">
      <div class="col"><div class="hint">current render</div>${c.preview_url?`<video src="${c.preview_url}" controls preload="metadata"></video>`:'<div class="hint">not rendered yet</div>'}</div>
      <div class="col"><div class="hint">cut preview (9:16, approximate · with audio)</div>
        <div class="phone"><video class="pv" playsinline preload="metadata"></video><div class="cap"></div></div>
        <div class="transport"><button class="tplay" title="play/pause">▶</button><button class="trestart" title="back to clip start">⏮ start</button><button class="tstepb" title="back one frame">◀ǀ</button><button class="tstepf" title="forward one frame">ǀ▶</button><div class="pbar"><div class="pfill"></div></div></div>
        <div class="clock pvclock hint">source —:— · cut —:—</div>
        <div class="framing">
          <span class="hint">Framing</span>
          <button class="fr-left" title="shift crop left">◀</button>
          <input class="fr-slider" type="range" min="-0.4" max="0.4" step="0.05" value="0">
          <button class="fr-right" title="shift crop right">▶</button>
          <span class="hint fr-val">centered</span>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="render" title="Render this clip with ffmpeg (true final look)">render this clip</button>
      <button class="saveclip" title="Write this clip's edit decisions to the plan (no video)">export metadata</button>
      <span class="hint renderstatus"></span>
      <span class="hint savestatus"></span>
    </div>`;
  renderStoryboardWords(div,c);
  renderTimeline(div,c);
  setupPreview(div,c);
  // framing nudge (same model as review mode)
  const fs=div.querySelector('.fr-slider'); fs.value=c.framing;
  const nudge=v=>{ c._pausePreview&&c._pausePreview(); c.framing=v; applyFraming(div,c); };
  fs.oninput=()=>nudge(+fs.value);
  div.querySelector('.fr-left').onclick=()=>nudge(Math.max(-0.4,+(c.framing-0.05).toFixed(2)));
  div.querySelector('.fr-right').onclick=()=>nudge(Math.min(0.4,+(c.framing+0.05).toFixed(2)));
  applyFraming(div,c);
  const rb=div.querySelector('.render');
  if(!FFMPEG){ rb.disabled=true; rb.title='Install ffmpeg to render finals here'; }
  rb.onclick=()=>renderClipNow(div,c);
  div.querySelector('.saveclip').onclick=()=>saveClip(div,c);
  div.querySelector('.cardtext').oninput=e=>{ c.cardText=e.target.value; };
  // source video playhead drives the timeline "now" marker and karaoke word
  // highlight. A rAF loop tracks the playhead more smoothly than timeupdate
  // (which fires ~4x/s, too coarse for fast speech); it stops on pause or when
  // this storyboard is replaced (element detached).
  const sv=div.querySelector('.sb-src');
  if(sv){
    const sync=()=>{ highlightNowUnit(div,sv.currentTime); highlightSpokenWord(div,sv.currentTime); };
    let raf=null;
    const tick=()=>{ if(!document.contains(sv) || sv.paused){ raf=null; return; } sync(); raf=requestAnimationFrame(tick); };
    sv.onplay=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
    sv.onpause=sync; sv.onseeked=sync; sv.ontimeupdate=()=>{ if(!raf) sync(); };
  }
  updateSegInfo(div,c);
  return div;
}

function renderStoryboardWords(div,c){
  const W=CURRENT.W, t=div.querySelector('.sb-tx');
  let html='';
  for(let i=0;i<W.length;i++){
    html+=`<span class="w ${c.inSet.has(i)?'in':'out'}" data-i="${i}" title="source ${fmt1(W[i].start)}">${esc(W[i].text)}</span> `;
  }
  t.innerHTML=html||'<span class="hint">no transcript</span>';
  t.querySelectorAll('.w').forEach(sp=>{
    sp.onclick=()=>{ const i=+sp.dataset.i;
      if(c.inSet.has(i)) c.inSet.delete(i); else c.inSet.add(i);
      sp.className='w '+(c.inSet.has(i)?'in':'out'); c.captions=null;
      syncUnitsFromWords(div,c); updateSegInfo(div,c); };
  });
}

// After word-level edits, re-evaluate which units read as selected.
function syncUnitsFromWords(div,c){
  div.querySelectorAll('.sb-unit').forEach(el=>{
    el.classList.toggle('sel', unitSelected(c,+el.dataset.u));
  });
}

function renderTimeline(div,c){
  const tl=div.querySelector('.sb-timeline'), U=CURRENT.U||[];
  tl.innerHTML='';
  if(!U.length){ tl.innerHTML='<div class="hint">no content units in this transcript</div>'; return; }
  U.forEach((u,ui)=>{
    const el=document.createElement('div');
    el.className='sb-unit'+(unitSelected(c,ui)?' sel':'');
    el.dataset.u=ui;
    el.style.width=Math.max(70,Math.min(260,(u.end-u.start)*12))+'px';
    el.innerHTML=`<span class="ut">${fmt(u.start)}</span>${esc(u.summary)||'…'}`;
    el.onclick=()=>toggleUnit(div,c,ui,el);
    tl.appendChild(el);
  });
  const firstSel=tl.querySelector('.sb-unit.sel');
  if(firstSel) firstSel.scrollIntoView({inline:'center',block:'nearest'});
}

function toggleUnit(div,c,ui,el){
  const idxs=CURRENT.unitWords[ui]||[]; const sel=unitSelected(c,ui);
  const t=div.querySelector('.sb-tx');
  for(const i of idxs){
    if(sel) c.inSet.delete(i); else c.inSet.add(i);
    const sp=t.querySelector('.w[data-i="'+i+'"]');
    if(sp) sp.className='w '+(c.inSet.has(i)?'in':'out');
  }
  el.classList.toggle('sel', !sel);
  c.captions=null; updateSegInfo(div,c);
  const sv=div.querySelector('.sb-src');
  if(sv && CURRENT.U[ui]){ try{ sv.currentTime=CURRENT.U[ui].start; }catch(e){} }
}

// Karaoke highlight: mark the word currently being spoken (rightmost word whose
// start is at/before the playhead) and keep it scrolled into view. Clears during
// long silences so a highlight never gets stuck between words.
function highlightSpokenWord(div,t){
  const W=CURRENT.W||[], tx=div.querySelector('.sb-tx'); if(!tx) return;
  let lo=0, hi=W.length-1, idx=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(W[m].start<=t){ idx=m; lo=m+1; } else hi=m-1; }
  const prev=tx.querySelector('.w.spoken');
  if(idx<0 || t > W[idx].end + 1.0){ if(prev) prev.classList.remove('spoken'); return; }
  const el=tx.querySelector('.w[data-i="'+idx+'"]');
  if(!el || el===prev) return;
  if(prev) prev.classList.remove('spoken');
  el.classList.add('spoken');
  // keep the word visible by nudging only the transcript panel (never the page)
  const cr=tx.getBoundingClientRect(), er=el.getBoundingClientRect();
  if(er.top<cr.top || er.bottom>cr.bottom) tx.scrollTop += (er.top-cr.top) - cr.height/2 + er.height/2;
}

// Mark the unit currently under the source-video playhead.
function highlightNowUnit(div,t){
  const U=CURRENT.U||[]; let lo=0,hi=U.length-1,found=-1;
  while(lo<=hi){ const m=(lo+hi)>>1;
    if(t<U[m].start) hi=m-1; else if(t>U[m].end) lo=m+1; else { found=m; break; } }
  const tl=div.querySelector('.sb-timeline');
  const prev=tl.querySelector('.sb-unit.now'); if(prev) prev.classList.remove('now');
  if(found>=0){ const el=tl.querySelector('.sb-unit[data-u="'+found+'"]'); if(el) el.classList.add('now'); }
  const clk=div.querySelector('.sb-srcclock'); if(clk) clk.textContent='source '+fmt1(t);
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
loadProjects();
