[project]
name = "video-clip-extractor"
version = "0.1.0"
description = "Pipeline experiments for extracting interesting clips from videos."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "opentimelineio>=0.17",
    "otio-cmx3600-adapter>=0.1",
    "otio-fcpx-xml-adapter>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
transcribe-video = "extractor.transcribe:main"
qa-transcript = "extractor.qa_transcript:main"
plan-clip-ads = "extractor.plan_clip_ads:main"
preprocess-video = "extractor.preprocess_video:main"
cloudflare-stream-capture = "extractor.cloudflare_stream_capture:main"
openai-strategy = "extractor.openai_strategy:main"
openai-moments = "extractor.openai_moments:main"
openai-plan = "extractor.openai_plan:main"
openai-critique = "extractor.openai_critique:main"
openai-revise = "extractor.openai_revise:main"
render-plan = "extractor.render_plan:main"
edit-list = "extractor.edit_list:main"
migrate-run-layout = "extractor.migrate_run_layout:main"
subject-index = "extractor.subject_index:main"
video-api-probe = "extractor.video_api_probe:main"
visual-index = "extractor.visual_index:main"
extract-clips = "extractor.run_pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
